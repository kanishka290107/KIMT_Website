<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | K.I.M.T Computer Classes</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        indigo: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#312e81',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-white to-blue-50 min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <!-- Header Navigation -->
    <header class="w-full max-w-7xl mx-auto px-6 py-6 flex justify-between items-center">
        <a href="index.html" class="flex items-center gap-3 group">
            <div class="w-10 h-10 bg-gradient-to-br from-indigo-500 to-indigo-700 rounded-xl flex items-center justify-center shadow-lg shadow-indigo-500/30 group-hover:scale-105 transition-transform">
                <span class="text-white font-bold text-xl">K</span>
            </div>
            <span class="font-extrabold text-2xl text-gray-900 tracking-tight">K.I.M.T<span class="text-indigo-600">.</span></span>
        </a>
        <div class="flex items-center gap-4">
            <a href="verify.html" class="text-sm font-semibold text-gray-600 hover:text-indigo-600 transition-colors flex items-center gap-2">
                <i class="fas fa-certificate text-indigo-500"></i> Verify Certificate
            </a>
            <a href="index.html" class="text-sm font-semibold text-gray-600 hover:text-indigo-600 transition-colors flex items-center gap-1.5 bg-white px-4 py-2 rounded-full border border-gray-200 shadow-sm hover:border-indigo-200">
                <i class="fas fa-arrow-left text-xs"></i> Back to Website
            </a>
        </div>
    </header>

    <!-- Login Container -->
    <main class="flex-grow flex items-center justify-center px-4 py-8">
        <div class="w-full max-w-md">
            
            <!-- Security / Brand Card -->
            <div class="bg-white rounded-3xl shadow-2xl shadow-indigo-900/10 border border-gray-100 p-8 sm:p-10 relative overflow-hidden">
                <!-- Top Accent Line -->
                <div class="absolute top-0 left-0 right-0 h-2 bg-gradient-to-r from-indigo-500 via-purple-500 to-indigo-600"></div>
                
                <!-- Icon Header -->
                <div class="text-center mb-8">
                    <div class="w-16 h-16 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-indigo-100 shadow-inner">
                        <i class="fas fa-shield-alt text-2xl"></i>
                    </div>
                    <h1 class="text-2xl sm:text-3xl font-extrabold text-gray-900 tracking-tight">Admin Portal</h1>
                    <p class="text-gray-500 text-sm mt-1">Sign in to upload and manage student certificates</p>
                </div>

                <!-- Alert Message -->
                <div id="alert-box" class="hidden mb-6 p-4 rounded-xl text-sm font-medium transition-all"></div>

                <!-- Login Form -->
                <form id="login-form" class="space-y-5">
                    <div>
                        <label for="username" class="block text-sm font-semibold text-gray-700 mb-2">
                            Username
                        </label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400">
                                <i class="fas fa-user"></i>
                            </span>
                            <input 
                                type="text" 
                                id="username" 
                                required 
                                autocomplete="username"
                                class="w-full pl-11 pr-4 py-3.5 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white focus:ring-2 focus:ring-indigo-600 focus:border-indigo-600 outline-none transition-all text-gray-900 text-sm" 
                                placeholder="Enter username (admin)"
                            >
                        </div>
                    </div>

                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <label for="password" class="block text-sm font-semibold text-gray-700">
                                Password
                            </label>
                        </div>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400">
                                <i class="fas fa-lock"></i>
                            </span>
                            <input 
                                type="password" 
                                id="password" 
                                required 
                                autocomplete="current-password"
                                class="w-full pl-11 pr-12 py-3.5 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white focus:ring-2 focus:ring-indigo-600 focus:border-indigo-600 outline-none transition-all text-gray-900 text-sm" 
                                placeholder="Enter password (admin12345)"
                            >
                            <button 
                                type="button" 
                                id="toggle-password" 
                                class="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-400 hover:text-gray-600 focus:outline-none"
                            >
                                <i class="fas fa-eye" id="eye-icon"></i>
                            </button>
                        </div>
                    </div>

                    <button 
                        type="submit" 
                        id="submit-btn"
                        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-indigo-600/30 transition-all transform hover:-translate-y-0.5 active:translate-y-0 flex items-center justify-center gap-2 mt-6"
                    >
                        <span>Sign In</span>
                        <i class="fas fa-arrow-right text-sm"></i>
                    </button>
                </form>

                <!-- Demo Hint Box -->
                <div class="mt-8 pt-6 border-t border-gray-100 bg-gray-50/80 -mx-8 -mb-8 p-6 rounded-b-3xl">
                    <div class="flex items-center justify-between text-xs text-gray-600">
                        <div>
                            <span class="font-bold text-gray-800">Demo Login:</span>
                            <p class="font-mono mt-0.5 text-gray-500">User: <strong class="text-indigo-600">admin</strong> | Pass: <strong class="text-indigo-600">admin12345</strong></p>
                        </div>
                        <button 
                            type="button" 
                            id="autofill-btn"
                            class="bg-white hover:bg-indigo-50 border border-gray-200 hover:border-indigo-200 text-indigo-600 font-semibold px-3 py-1.5 rounded-lg transition-colors shadow-sm"
                        >
                            Quick Autofill
                        </button>
                    </div>
                </div>

            </div>

            <p class="text-center text-xs text-gray-500 mt-6">
                &copy; 2026 K.I.M.T Computer Classes. All Rights Reserved.
            </p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-4 text-center text-xs text-gray-400">
        Authorized Administration System
    </footer>

    <!-- Scripts -->
    <script src="db.js"></script>
    <script>
        // Check if already logged in
        if (Auth.isLoggedIn()) {
            window.location.href = 'admin.html';
        }

        const loginForm = document.getElementById('login-form');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const alertBox = document.getElementById('alert-box');
        const toggleBtn = document.getElementById('toggle-password');
        const eyeIcon = document.getElementById('eye-icon');
        const autofillBtn = document.getElementById('autofill-btn');

        // Toggle Password Visibility
        toggleBtn.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            eyeIcon.className = isPassword ? 'fas fa-eye-slash' : 'fas fa-eye';
        });

        // Quick Autofill
        autofillBtn.addEventListener('click', () => {
            usernameInput.value = 'admin';
            passwordInput.value = 'admin12345';
            usernameInput.classList.add('ring-2', 'ring-indigo-500');
            passwordInput.classList.add('ring-2', 'ring-indigo-500');
            setTimeout(() => {
                usernameInput.classList.remove('ring-2', 'ring-indigo-500');
                passwordInput.classList.remove('ring-2', 'ring-indigo-500');
            }, 600);
        });

        // Form Submit
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = usernameInput.value;
            const password = passwordInput.value;

            const isAuth = await Auth.login(username, password);
            if (isAuth) {
                alertBox.className = 'mb-6 p-4 rounded-xl text-sm font-medium bg-emerald-50 text-emerald-700 border border-emerald-200 flex items-center gap-2';
                alertBox.innerHTML = '<i class="fas fa-check-circle"></i> Login successful! Redirecting to dashboard...';
                alertBox.classList.remove('hidden');

                setTimeout(() => {
                    window.location.href = 'admin.html';
                }, 700);
            } else {
                alertBox.className = 'mb-6 p-4 rounded-xl text-sm font-medium bg-rose-50 text-rose-700 border border-rose-200 flex items-center gap-2';
                alertBox.innerHTML = '<i class="fas fa-exclamation-circle"></i> Invalid credentials. Use <strong>admin</strong> and <strong>admin12345</strong>.';
                alertBox.classList.remove('hidden');
                passwordInput.value = '';
                passwordInput.focus();
            }
        });
    </script>
</body>
</html>
